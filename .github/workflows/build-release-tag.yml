name: Build Release Tag

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        board:
          - auto_rp2040
          - miolink
          - miolink_pico
          - pico
          - pico_w
          - pico2
          - pico2_w
          - weact_studio_rp2040_2mb
          - weact_studio_rp2040_16mb
          - waveshare_rp2040_zero
          - waveshare_rp2040_plus_4mb
          - seeed_xiao_rp2040

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - uses: carlosperate/arm-none-eabi-gcc-action@v1

    - name: Configure CMake
      working-directory: ./firmware
      run: cmake -S . -B ./build -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=${{ matrix.board }}

    - name: Build
      working-directory: ./firmware
      run: cmake --build ./build --config Release

    - name: Rename binary
      working-directory: ./firmware/build
      run: mv MioLink.uf2 MioLink_${{ github.ref_name }}_${{ matrix.board }}.uf2

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MioLink_${{ matrix.board }}
        path: ./firmware/build/MioLink_${{ github.ref_name }}_${{ matrix.board }}.uf2

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
        merge-multiple: true

    - uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: false
        title: "${{ github.ref_name }}"
        files: ./artifacts/*.uf2
